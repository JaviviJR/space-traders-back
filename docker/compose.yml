name: space-trader-backend
services:
  php:
    container_name: space-trader-backend-php
    build:
      context: ./php
      target: ${PHP_ENV:-dev}
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    mem_limit: 2g
    user: "developer:developer"
    environment:
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL}
      GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME}
      GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL}
    volumes:
      - ${APP_DIR}:/home/developer/app
    working_dir: /home/developer/app
  phpactor:
    container_name: space-trader-backend-phpactor
    build:
      context: ./php
      target: phpactor-server
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        APP_DIR_ABS: ${APP_DIR_ABS}
    mem_limit: 512m
    restart: unless-stopped
    user: "developer:developer"
    volumes:
      # Montado en la misma ruta absoluta que en el host: Phpactor recibe URIs
      # file:// tal como las ve VSCode (sin mapeo de rutas en su extension), asi
      # que el contenedor tiene que ver el proyecto en ese mismo path exacto.
      - ${APP_DIR_ABS}:${APP_DIR_ABS}
    working_dir: ${APP_DIR_ABS}
    ports:
      - 9090:9090
    command: phpactor language-server --address=0.0.0.0:9090 -vvv

  nginx:
    container_name: space-trader-backend-nginx
    build: ./nginx
    depends_on:
      - php
      - postgres
    volumes:
      - ./nginx/etc/nginx/conf.d/vhost.conf:/etc/nginx/conf.d/vhost.conf
      - ${APP_DIR}:/home/developer/app:ro
    working_dir: /home/developer/app
    ports:
      - ${APP_PORT}:80

  postgres:
    container_name: space-trader-backend-postgres
    image: postgres:18-bookworm
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - 5432:5432
    volumes:
      - ./db-data:/var/lib/postgresql

  mailer:
    container_name: space-trader-backend-mailer
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  pgadmin4:
    container_name: space-trader-backend-pgadmin4
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - ${CONTAINER_LISTEN_PORT}:80
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin
