# Expose your documentation as JSON swagger compliant
app.swagger:
    path: /api/doc.json
    methods: GET
    defaults: { _controller: nelmio_api_doc.controller.swagger }

# Clean, public, documented alias for app.swagger (see doc/openapi.md) — same
# spec, same controller, just a stable URL for external consumers (e.g. the
# front's client generator) instead of /api/doc.json.
app.openapi_public:
    path: /openapi
    methods: GET
    defaults: { _controller: nelmio_api_doc.controller.swagger }

# Requires the Asset component and the Twig bundle
# $ composer require twig asset
app.swagger_ui:
    path: /api/doc
    methods: GET
    defaults: { _controller: nelmio_api_doc.controller.swagger_ui }
