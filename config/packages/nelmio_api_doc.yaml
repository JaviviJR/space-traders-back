nelmio_api_doc:
    documentation:
        info:
            title: Space Traders Back
            description:
            version: 1.0.0
    areas: # to filter documented areas
        default:
            path_patterns:
                - ^/(api(?!/doc$)(?!/spacetraders)|auth) # Accepts routes under /api (except /api/doc and /api/spacetraders, hand-documented by App\SpaceTraders\OpenApi\ProxyDescriber) and /auth
            security:
                bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } # Inferred per-route from #[IsGranted]
    models:
        # Front-facing schema names for the generated spec (and the front's codegen).
        # Also covers #[MapRequestPayload] classes: Nelmio registers those under their bare class
        # name even when the controller's own #[OA\RequestBody] already names the model, so without
        # this alias both an orphan "XxxDto" and the clean name would show up in components/schemas.
        #
        # Every back-only request DTO and response data class gets an alias here (one mechanism,
        # even for response-only classes). Naming rule: the action's operationId in PascalCase plus
        # `Request` (request body) or `Response` (the `data` model). A class shared by several
        # operations is named after its content instead. Avoid names SpaceTraders' vendored spec
        # already defines (e.g. `Agent`) and JS/TS globals (hence `ApiError`, not `Error`): Nelmio
        # silently renames a collision to `Agent2`, so check `bin/console nelmio:apidoc:dump
        # --format=json` after adding one.
        # A model reached only through a property (e.g. an enum) ignores its alias and is named
        # after the class's short name, so name the PHP class as the front should see it (hence
        # App\Http\ApiErrorCode). Keep its alias anyway.
        names:
            - { alias: RegisterUserRequest, type: App\Security\Dto\RegisterUserDto }
            - { alias: RegisterUserResponse, type: App\Security\Dto\RegisterResponseData }
            - { alias: ResendConfirmationRequest, type: App\Security\Dto\ResendConfirmationDto }
            - { alias: ConfirmEmailResponse, type: App\Security\Dto\ConfirmEmailResponseData }
            # Shared by login and refreshToken: one alias per class, so it's named after its content.
            - { alias: AccessTokenResponse, type: App\Security\Dto\AccessTokenResponseData }
            # Generic on purpose, reusable by any response with `data: {}`, even though only
            # resendConfirmation uses it today: not ResendConfirmationResponse.
            - { alias: Empty, type: App\Security\Dto\EmptyResponseData }
            - { alias: ApiError, type: App\Http\ErrorResponseData }
            - { alias: ApiErrorCode, type: App\Http\ApiErrorCode }
            - { alias: ApiErrorValidation, type: App\Http\ValidationErrorResponseData }
            # TODO: provisional name, revisit when the front consumes listAgents. It's each item of
            # `data`, not the response itself, and ties a domain model to one operation.
            - { alias: ListAgentsResponseItem, type: App\Agent\Dto\AgentResponseData }
